[project]
name = "calconflict"
version = "0.1.0"
description = "终端日程冲突排查工具：冲突分析、空档建议、文本报告"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
calconflict = "calconflict.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["calconflict*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
